<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NOTE SPLIT</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #555;
      --muted: #858585;
      --line: #d8d8d8;
      --soft: #f7f7f7;
      --white: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--white);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    .page-header {
      padding: 54px 20px 48px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #515151;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    main {
      width: min(100% - 40px, 900px);
      margin: 0 auto;
      padding-bottom: 72px;
    }

    .import-button {
      width: 100%;
      min-height: 94px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 26px;
      border: 1px solid #bdbdbd;
      border-radius: 4px;
      background: var(--white);
      color: #666;
      text-align: left;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .import-button:hover {
      border-color: #777;
      background: #fafafa;
    }

    .import-button:focus-visible,
    .remove-button:focus-visible {
      outline: 3px solid #888;
      outline-offset: 3px;
    }

    .plus {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border: 1px solid #aaa;
      border-radius: 50%;
      color: #666;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
    }

    .import-label {
      font-size: 16px;
      font-weight: 650;
    }

    .import-support {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .section-heading {
      margin: 47px 0 22px;
    }

    .section-heading h2 {
      margin: 0 0 16px;
      color: #666;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      border: 0;
      margin: 0;
      background: var(--line);
    }

    .empty-state {
      padding: 40px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }

    .song-list {
      display: grid;
      gap: 16px;
    }

    .song-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--white);
      animation: appear 180ms ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .song-card-header {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid #e8e8e8;
    }

    .song-name {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      margin: 0;
      color: #606060;
      font-size: 14px;
      font-weight: 650;
    }

    .song-status {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: #858585;
      font-size: 19px;
      cursor: pointer;
    }

    .remove-button:hover {
      background: var(--soft);
      color: #555;
    }

    .instrument-lane {
      min-height: 132px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
    }

    .instrument-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 12px;
      border-right: 1px solid #e8e8e8;
      background: #fbfbfb;
    }

    .instrument-image {
      width: 116px;
      height: 68px;
      object-fit: contain;
    }

    .instrument-caption {
      color: #666;
      font-size: 11px;
      font-weight: 650;
    }

    .instrument-select {
      width: 100%;
      max-width: 128px;
      min-height: 30px;
      padding: 4px 6px;
      border: 1px solid #d1d1d1;
      border-radius: 3px;
      background: var(--white);
      color: #666;
      font-size: 11px;
    }

    .instrument-notes {
      min-width: 0;
      padding: 16px;
    }

    .instrument-notes-heading {
      color: #858585;
      font-size: 10px;
      font-weight: 650;
    }

    .note-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 0 0;
    }

    .note-box {
      width: 76px;
      min-height: 58px;
      display: grid;
      align-content: center;
      gap: 4px;
      border: 1px solid #d6d6d6;
      border-radius: 3px;
      background: #fafafa;
      text-align: center;
    }

    .note-name {
      color: #5b5b5b;
      font-size: 14px;
      font-weight: 700;
    }

    .note-time {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .note-empty {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .footnote {
      margin: 16px 0 0;
      color: #929292;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      .page-header {
        padding-top: 40px;
        padding-bottom: 36px;
      }

      main {
        width: min(100% - 28px, 900px);
      }

      .import-button {
        min-height: 82px;
        padding: 16px;
      }

      .section-heading {
        margin-top: 36px;
      }

      .song-card-header {
        flex-wrap: wrap;
      }

      .instrument-lane {
        grid-template-columns: 96px minmax(0, 1fr);
      }

      .instrument-side {
        gap: 5px;
        padding: 9px 6px;
      }

      .instrument-image {
        width: 78px;
        height: 58px;
      }

      .instrument-select {
        padding: 4px 3px;
        font-size: 10px;
      }

      .instrument-notes {
        padding: 13px 10px;
      }

      .note-list {
        gap: 5px;
      }

      .note-box {
        width: 62px;
        min-height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>NOTE SPLIT</h1>
  </header>

  <main>
    <button class="import-button" id="import-button" type="button">
      <span class="plus" aria-hidden="true">+</span>
      <span class="import-label">Import Song<span class="import-support">Choose an audio file from this device</span></span>
    </button>
    <input class="file-input" id="audio-file" type="file" accept="audio/*" multiple aria-label="Choose audio files">

    <section aria-labelledby="instrument-notes-title">
      <div class="section-heading">
        <h2 id="instrument-notes-title">Instrument Notes</h2>
        <hr class="divider">
      </div>
      <div class="song-list" id="song-list" aria-live="polite">
        <div class="empty-state" id="empty-state">Import a song, then choose an instrument to pair it with its detected notes.</div>
      </div>
      <p class="footnote">Pitch detection shows the strongest note estimate at each moment. Chords, layered instruments, and noisy recordings may be approximate. Audio is processed in your browser and is not uploaded.</p>
    </section>
  </main>

  <script>
    const fileInput = document.querySelector('#audio-file');
    const importButton = document.querySelector('#import-button');
    const songList = document.querySelector('#song-list');
    const songs = [];
    const instrumentImageCache = new Map();
    let nextSongId = 1;

    importButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const files = [...fileInput.files];
      fileInput.value = '';
      for (const file of files) {
        const song = {
          id: nextSongId++,
          name: file.name,
          status: 'Reading audio…',
          instrument: '',
          notes: [],
          error: false
        };
        songs.unshift(song);
        renderSongs();
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error('Audio is not supported in this browser.');
          const context = new AudioContextClass();
          const audioBuffer = await context.decodeAudioData(await file.arrayBuffer());
          await context.close();
          song.status = 'Finding notes…';
          renderSongs();
          song.notes = await detectNotes(audioBuffer, (percent) => {
            song.status = `Finding notes… ${percent}%`;
            renderSongs();
          });
          song.status = `${formatTime(audioBuffer.duration)} · ${song.notes.length} notes found`;
        } catch (error) {
          song.status = error.message.includes('supported')
            ? error.message
            : 'Could not read this audio file. Try a WAV or MP3 file.';
          song.error = true;
        }
        renderSongs();
      }
    });

    function renderSongs() {
      songList.replaceChildren();
      if (!songs.length) {
        const emptyState = document.createElement('div');
        emptyState.className = 'empty-state';
        emptyState.textContent = 'Import a song, then choose an instrument to pair it with its detected notes.';
        songList.append(emptyState);
        return;
      }

      songs.forEach((song) => {
        const card = document.createElement('article');
        card.className = 'song-card';
        const header = document.createElement('div');
        header.className = 'song-card-header';
        const name = document.createElement('h3');
        name.className = 'song-name';
        name.textContent = song.name;
        const status = document.createElement('span');
        status.className = 'song-status';
        status.textContent = song.status;
        const remove = document.createElement('button');
        remove.className = 'remove-button';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', `Remove ${song.name}`);
        remove.addEventListener('click', () => {
          const index = songs.findIndex((item) => item.id === song.id);
          if (index >= 0) songs.splice(index, 1);
          renderSongs();
        });
        header.append(name, status, remove);
        card.append(header);

        const lane = document.createElement('div');
        lane.className = 'instrument-lane';
        const instrumentSide = document.createElement('div');
        instrumentSide.className = 'instrument-side';
        const image = document.createElement('img');
        image.className = 'instrument-image';
        image.src = createInstrumentImage(song.instrument);
        image.alt = song.instrument ? `${song.instrument} illustration` : 'Choose an instrument';
        const caption = document.createElement('span');
        caption.className = 'instrument-caption';
        caption.textContent = song.instrument || 'Instrument';
        const select = document.createElement('select');
        select.className = 'instrument-select';
        select.setAttribute('aria-label', `Choose instrument for ${song.name}`);
        [
          ['', 'Choose instrument'],
          ['Piano', 'Piano'],
          ['Guitar', 'Guitar'],
          ['Bass', 'Bass'],
          ['Drums', 'Drums'],
          ['Violin', 'Violin'],
          ['Voice', 'Voice']
        ].forEach(([value, label]) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = label;
          select.append(option);
        });
        select.value = song.instrument;
        select.addEventListener('change', () => {
          song.instrument = select.value;
          image.src = createInstrumentImage(song.instrument);
          image.alt = song.instrument ? `${song.instrument} illustration` : 'Choose an instrument';
          caption.textContent = song.instrument || 'Instrument';
        });
        instrumentSide.append(image, caption, select);

        const instrumentNotes = document.createElement('div');
        instrumentNotes.className = 'instrument-notes';
        const notesHeading = document.createElement('div');
        notesHeading.className = 'instrument-notes-heading';
        notesHeading.textContent = 'DETECTED NOTES';
        const noteList = document.createElement('div');
        noteList.className = 'note-list';
        if (song.notes.length) {
          song.notes.forEach((note) => {
            const box = document.createElement('div');
            box.className = 'note-box';
            const noteName = document.createElement('span');
            noteName.className = 'note-name';
            noteName.textContent = note.name;
            const noteTime = document.createElement('span');
            noteTime.className = 'note-time';
            noteTime.textContent = formatTime(note.start);
            box.append(noteName, noteTime);
            noteList.append(box);
          });
        } else {
          const placeholder = document.createElement('span');
          placeholder.className = 'note-empty';
          placeholder.textContent = song.error ? 'Notes are unavailable for this file.' : 'Analyzing audio…';
          noteList.append(placeholder);
        }
        instrumentNotes.append(notesHeading, noteList);
        lane.append(instrumentSide, instrumentNotes);
        card.append(lane);
        songList.append(card);
      });
    }

    function createInstrumentImage(instrument) {
      const key = instrument || 'unassigned';
      if (instrumentImageCache.has(key)) return instrumentImageCache.get(key);

      const canvas = document.createElement('canvas');
      canvas.width = 240;
      canvas.height = 140;
      const context = canvas.getContext('2d');
      context.lineWidth = 5;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = '#777';
      context.fillStyle = '#e5e5e5';

      if (instrument === 'Piano') {
        context.fillRect(28, 38, 184, 68);
        context.strokeRect(28, 38, 184, 68);
        for (let keyIndex = 0; keyIndex < 7; keyIndex++) {
          const x = 32 + keyIndex * 25;
          context.fillStyle = '#fff';
          context.fillRect(x, 42, 24, 59);
          context.strokeRect(x, 42, 24, 59);
        }
        context.fillStyle = '#777';
        [49, 74, 124, 149, 174].forEach((x) => context.fillRect(x, 42, 13, 36));
      } else if (instrument === 'Drums') {
        context.beginPath();
        context.ellipse(116, 81, 40, 16, 0, 0, Math.PI * 2);
        context.fill();
        context.stroke();
        context.beginPath();
        context.ellipse(116, 78, 40, 16, 0, 0, Math.PI * 2);
        context.fillStyle = '#f8f8f8';
        context.fill();
        context.stroke();
        [[72, 52, 18], [116, 42, 20], [160, 52, 18]].forEach(([x, y, radius]) => {
          context.beginPath();
          context.ellipse(x, y, radius, 12, 0, 0, Math.PI * 2);
          context.fillStyle = '#e5e5e5';
          context.fill();
          context.stroke();
        });
        context.beginPath();
        context.moveTo(34, 34);
        context.lineTo(70, 34);
        context.moveTo(170, 29);
        context.lineTo(208, 29);
        context.stroke();
        context.beginPath();
        context.moveTo(53, 35);
        context.lineTo(53, 103);
        context.moveTo(190, 30);
        context.lineTo(190, 102);
        context.moveTo(95, 95);
        context.lineTo(88, 124);
        context.moveTo(137, 95);
        context.lineTo(144, 124);
        context.stroke();
      } else if (instrument === 'Voice') {
        context.beginPath();
        context.roundRect(96, 22, 48, 70, 23);
        context.fill();
        context.stroke();
        context.beginPath();
        context.arc(120, 61, 36, Math.PI, 0);
        context.lineTo(156, 71);
        context.arc(120, 71, 36, 0, Math.PI);
        context.stroke();
        context.beginPath();
        context.moveTo(120, 107);
        context.lineTo(120, 123);
        context.moveTo(96, 124);
        context.lineTo(144, 124);
        context.stroke();
      } else if (instrument === 'Violin') {
        context.beginPath();
        context.moveTo(116, 24);
        context.bezierCurveTo(93, 34, 108, 49, 91, 59);
        context.bezierCurveTo(68, 72, 84, 117, 120, 122);
        context.bezierCurveTo(156, 117, 172, 72, 149, 59);
        context.bezierCurveTo(132, 49, 147, 34, 124, 24);
        context.closePath();
        context.fill();
        context.stroke();
        context.beginPath();
        context.moveTo(120, 24);
        context.lineTo(120, 120);
        context.moveTo(113, 50);
        context.lineTo(127, 50);
        context.stroke();
      } else if (instrument === 'Guitar' || instrument === 'Bass') {
        const bass = instrument === 'Bass';
        context.beginPath();
        context.moveTo(111, 71);
        context.bezierCurveTo(95, 57, bass ? 78 : 74, 72, bass ? 82 : 79, 93);
        context.bezierCurveTo(84, 118, 106, 126, 120, 112);
        context.bezierCurveTo(134, 126, 156, 118, 161, 93);
        context.bezierCurveTo(bass ? 162 : 166, 72, 145, 57, 129, 71);
        context.closePath();
        context.fill();
        context.stroke();
        context.fillStyle = '#ddd';
        context.fillRect(115, 22, 10, 60);
        context.strokeRect(115, 22, 10, 60);
        context.fillStyle = '#777';
        context.fillRect(111, 17, 18, 11);
        context.beginPath();
        context.arc(120, 92, 8, 0, Math.PI * 2);
        context.stroke();
        context.beginPath();
        for (let string = 0; string < (bass ? 4 : 6); string++) {
          const x = bass ? 117 + string * 2 : 116 + string * 1.6;
          context.moveTo(x, 22);
          context.lineTo(x, 109);
        }
        context.stroke();
      } else {
        context.beginPath();
        context.arc(105, 88, 17, 0, Math.PI * 2);
        context.fill();
        context.stroke();
        context.beginPath();
        context.moveTo(119, 84);
        context.lineTo(119, 33);
        context.lineTo(157, 41);
        context.lineTo(157, 87);
        context.stroke();
        context.beginPath();
        context.arc(143, 91, 14, 0, Math.PI * 2);
        context.fill();
        context.stroke();
      }

      const imageData = canvas.toDataURL('image/png');
      instrumentImageCache.set(key, imageData);
      return imageData;
    }

    async function detectNotes(buffer, onProgress) {
      const frameSize = 8192;
      const sampleRate = buffer.sampleRate;
      const samples = buffer.getChannelData(0);
      const hopSize = Math.max(1, Math.floor(sampleRate * 0.3));
      const real = new Float64Array(frameSize);
      const imaginary = new Float64Array(frameSize);
      const frameCount = Math.max(1, Math.ceil(Math.max(0, samples.length - frameSize) / hopSize));
      const notes = [];
      let activeNote = null;
      let previousMidi = null;

      for (let frame = 0; frame < frameCount; frame++) {
        const offset = frame * hopSize;
        let energy = 0;
        real.fill(0);
        imaginary.fill(0);

        for (let index = 0; index < frameSize && offset + index < samples.length; index++) {
          const sample = samples[offset + index] || 0;
          energy += sample * sample;
          const window = 0.5 - 0.5 * Math.cos((2 * Math.PI * index) / (frameSize - 1));
          real[index] = sample * window;
        }

        let midi = null;
        if (Math.sqrt(energy / frameSize) > 0.008) {
          fft(real, imaginary);
          let strongestScore = 0;
          let strongestBin = 0;
          const lowestBin = Math.max(1, Math.floor((55 * frameSize) / sampleRate));
          const highestBin = Math.min(Math.floor((1200 * frameSize) / sampleRate), frameSize / 2 - 1);
          for (let bin = lowestBin; bin <= highestBin; bin++) {
            let score = Math.hypot(real[bin], imaginary[bin]);
            for (let harmonic = 2; harmonic <= 4 && bin * harmonic < frameSize / 2; harmonic++) {
              score += Math.hypot(real[bin * harmonic], imaginary[bin * harmonic]) / harmonic;
            }
            if (score > strongestScore) {
              strongestScore = score;
              strongestBin = bin;
            }
          }

          if (strongestBin) {
            const left = Math.hypot(real[strongestBin - 1], imaginary[strongestBin - 1]);
            const center = Math.hypot(real[strongestBin], imaginary[strongestBin]);
            const right = Math.hypot(real[strongestBin + 1], imaginary[strongestBin + 1]);
            const denominator = left - 2 * center + right;
            const correction = denominator ? 0.5 * (left - right) / denominator : 0;
            const frequency = (strongestBin + correction) * sampleRate / frameSize;
            if (frequency > 0) midi = Math.round(69 + 12 * Math.log2(frequency / 440));
          }
        }

        const start = offset / sampleRate;
        if (midi !== previousMidi) {
          if (activeNote) {
            activeNote.end = start;
            if (activeNote.end - activeNote.start >= 0.12) notes.push(activeNote);
          }
          activeNote = midi === null ? null : { name: midiToNote(midi), start, end: start + hopSize / sampleRate };
          previousMidi = midi;
        } else if (activeNote) {
          activeNote.end = start + hopSize / sampleRate;
        }

        if (frame % 16 === 0) {
          onProgress(Math.min(99, Math.round((frame / frameCount) * 100)));
          await new Promise((resolve) => requestAnimationFrame(resolve));
        }
      }

      if (activeNote && activeNote.end - activeNote.start >= 0.12) notes.push(activeNote);
      return notes;
    }

    function fft(real, imaginary) {
      const size = real.length;
      for (let index = 1, reversed = 0; index < size; index++) {
        let bit = size >> 1;
        for (; reversed & bit; bit >>= 1) reversed ^= bit;
        reversed ^= bit;
        if (index < reversed) {
          [real[index], real[reversed]] = [real[reversed], real[index]];
          [imaginary[index], imaginary[reversed]] = [imaginary[reversed], imaginary[index]];
        }
      }

      for (let length = 2; length <= size; length <<= 1) {
        const angle = (-2 * Math.PI) / length;
        const stepReal = Math.cos(angle);
        const stepImaginary = Math.sin(angle);
        for (let start = 0; start < size; start += length) {
          let twiddleReal = 1;
          let twiddleImaginary = 0;
          for (let offset = 0; offset < length / 2; offset++) {
            const even = start + offset;
            const odd = even + length / 2;
            const productReal = twiddleReal * real[odd] - twiddleImaginary * imaginary[odd];
            const productImaginary = twiddleReal * imaginary[odd] + twiddleImaginary * real[odd];
            real[odd] = real[even] - productReal;
            imaginary[odd] = imaginary[even] - productImaginary;
            real[even] += productReal;
            imaginary[even] += productImaginary;
            [twiddleReal, twiddleImaginary] = [
              twiddleReal * stepReal - twiddleImaginary * stepImaginary,
              twiddleReal * stepImaginary + twiddleImaginary * stepReal
            ];
          }
        }
      }
    }

    function midiToNote(midi) {
      const noteNames = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
      return `${noteNames[((midi % 12) + 12) % 12]}${Math.floor(midi / 12) - 1}`;
    }

    function formatTime(seconds) {
      const totalSeconds = Math.floor(seconds);
      return `${Math.floor(totalSeconds / 60)}:${String(totalSeconds % 60).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
